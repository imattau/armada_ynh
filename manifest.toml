packaging_format = 2

id = "armada"
name = "Armada"
description.en = "End-to-end encrypted community chat built on Nostr"
version = "0.3.0~ynh6"
maintainers = ["armada_ynh contributors"]

[upstream]
license = "AGPL-3.0-only"
website = "https://armada.buzz/"
code = "https://github.com/soapbox-pub/armada"
demo = "https://armada.buzz/"

[integration]
yunohost = ">= 11.1.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "350M"
ram.build = "1G"
ram.runtime = "1M"

[install]

    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/armada"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    help = "Who should be allowed to access the Armada web client?"

    [install.app_name]
    ask.en = "Display name"
    type = "string"
    default = "Armada"
    example = "Community Armada"

    [install.app_relays]
    ask.en = "Default Nostr relays (comma-separated WebSocket URLs)"
    type = "string"
    default = "wss://relay.ditto.pub,wss://relay.dreamith.to"

    [install.search_relays]
    ask.en = "Search relays (comma-separated WebSocket URLs)"
    type = "string"
    default = "wss://relay.ditto.pub,wss://relay.dreamith.to"

    [install.platform_relays]
    ask.en = "Pinned platform relays (optional; leave empty to let users configure relays)"
    type = "string"
    optional = true
    default = ""

[resources]

    [resources.sources.main]
    url = "https://github.com/soapbox-pub/armada/archive/5b99f88d309052abc1eeb4f0b2ef437de086e709.tar.gz"
    sha256 = "60322ce80538e047d40a4846d142eaf60a1ae87e1f758da3b75f6547419a5804"

    [resources.system_user]

    [resources.install_dir]

    [resources.apt]
    packages = "ca-certificates, curl"

    [resources.nodejs]
    version = "22"

    [resources.permissions]
    main.url = "/"
