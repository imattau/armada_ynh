# Armada is a static Vite SPA. Keep missing hashed assets as 404s while routing
# application navigations back to index.html.
location __PATH__/assets/ {
    alias __INSTALL_DIR__/dist/assets/;
    try_files $uri =404;
}

location __PATH__/ {
    alias __INSTALL_DIR__/dist/;
    index index.html;
    try_files $uri $uri/ __PATH__/index.html;
}
